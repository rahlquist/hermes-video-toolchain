# OpenScreen MCP server — Hermes config snippet
#
# The installer adds this automatically. To add it by hand, merge it into the
# existing `mcp_servers:` mapping in ~/.hermes/config.yaml (do NOT create a
# second top-level `mcp_servers:` key).
#
# Replace the command with the absolute path to the OpenScreen CLI on your
# machine. With this repo's installer that is /home/<you>/.local/bin/openscreen
# on Linux, or /Applications/Openscreen.app/Contents/MacOS/Openscreen on macOS.

  openscreen:
    command: /home/YOUR_USER/.local/bin/openscreen
    args:
      - mcp
    enabled: true
